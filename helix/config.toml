theme = "adaptive"

[editor]
scrolloff = 10
true-color = true
editor-config = true
bufferline = "multiple"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.indent-guides]
render = true
character = "╎"
skip-levels = 1

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.soft-wrap]
enable = true # wraps text

[keys.insert]
# f = { j = "normal_mode" } # Maps "fj" to exit insert mode
# j = { f = "normal_mode" } # Maps "jf" to exit insert mode
esc = ["collapse_selection", "normal_mode"] # Escape deselects and enters normal mode every time.

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"] # Escape deselects and enters normal mode every time.
X = "extend_line_above" # Press X to extend selection one line up.
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
tab = "goto_next_buffer"
S-tab = "goto_previous_buffer"

[keys.select]
"}" = "goto_next_paragraph"
"{" = "goto_prev_paragraph"
