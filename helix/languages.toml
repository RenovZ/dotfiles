# ============================================================
# Language Servers
# ============================================================

[language-server.rust-analyzer]
command = "rust-analyzer"
config = { check = { command = "check" } }

[language-server.gopls]
command = "gopls"

[language-server.gopls.config]
gofumpt = true
local = "goimports"
semanticTokens = true
staticcheck = true
verboseOutput = true
usePlaceholders = true
completeUnimported = true

[language-server.gopls.config.analyses]
fieldalignment = true
nilness = true
unusedparams = true
unusedwrite = true
useany = true

[language-server.gopls.config.hints]
assignVariableType = true
compositeLiteralFields = true
compositeLiteralTypes = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]

[language-server.vtsls.config.typescript.inlayHints]
parameterNames.enabled = false
parameterTypes.enabled = false
variableTypes.enabled = false
propertyDeclarationTypes.enabled = false
functionLikeReturnTypes.enabled = false
enumMemberValues.enabled = false

[language-server.vtsls.config.javascript.inlayHints]
parameterNames.enabled = false
parameterTypes.enabled = false
variableTypes.enabled = false
propertyDeclarationTypes.enabled = false
functionLikeReturnTypes.enabled = false
enumMemberValues.enabled = false

[language-server.svelteserver]
command = "svelteserver"
args = ["--stdio"]

[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[language-server.deno]
command = "deno"
args = ["lsp"]

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.eslint.config]
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
format = { enable = true }
nodePath = ""
quiet = false
rulesCustomizations = []
run = "onType"
validate = "on"
experimental = {}
problems = { shortenToSingleLine = false }

[language-server.eslint.config.codeAction]
disableRuleComment = { enable = true, location = "separateLine" }
showDocumentation = { enable = false }

[language-server.emmet-lsp]
command = "emmet-language-server"
args = ["--stdio"]

[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

[language-server.vscode-json-language-server.config]
json = { validate = { enable = true }, format = { enable = true } }
provideFormatter = true

[language-server.vscode-css-language-server]
command = "vscode-css-language-server"
args = ["--stdio"]

[language-server.vscode-css-language-server.config]
css = { validate = { enable = true } }
scss = { validate = { enable = true } }
less = { validate = { enable = true } }
provideFormatter = true

# ============================================================
# Languages
# ============================================================

[[language]]
name = "rust"
language-servers = ["rust-analyzer"]

[[language]]
name = "go"
roots = ["go.work", "go.mod"]
auto-format = true
formatter = { command = "goimports" }
comment-token = "//"
language-servers = ["gopls"]

[[language]]
name = "python"
language-servers = ["ruff", "ty"]
formatter = { command = "ruff", args = ["format", "-"] }

[[language]]
name = "svelte"
language-servers = [
  "svelteserver",
  "vtsls",
  "tailwindcss-ls",
]
formatter = { command = "bunx", args = ["prettier", "--parser", "svelte"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "svelte"] }
comment-token = "<!--"
auto-format = true

[[language]]
name = "typescript"
language-servers = ["vtsls", "eslint", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "ts"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = ["vtsls", "eslint", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "tsx"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = ["vtsls", "eslint", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "javascript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "js"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = ["vtsls", "eslint", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "typescript"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "jsx"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "bunx", args = ["prettier", "--parser", "json"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }
auto-format = true

[[language]]
name = "html"
language-servers = ["vscode-html-language-server", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "html"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = ["vscode-css-language-server", "emmet-lsp"]
formatter = { command = "bunx", args = ["prettier", "--parser", "css"] }
# formatter = { command = "dprint", args = ["fmt", "--stdin", "css"] }
auto-format = true
