# keymap.toml — Keybindings ported from lfrc
# Yazi default keys are kept; only lf-specific mappings are added.

# ═══════════════════════════════════════════════════════════
# Git commands (g prefix) — ported from lfrc
# ═══════════════════════════════════════════════════════════

[[manager.prepend_keymap]]
on   = [ "g", "a" ]
run  = 'shell "git-forgit add" --block'
desc = "Git add (forgit)"

[[manager.prepend_keymap]]
on   = [ "g", "p" ]
run  = '''
  shell " \
    current_branch=\$(git branch --show-current); \
    selected=\$(git branch -rv | fzf --header=\"\$current_branch (current branch)\n\$(git remote -v | awk '{print \$1 \" \" \$2}' | sort | uniq)\" \
      --preview=\"echo {} | awk '{print \\\$2}' | xargs git show\"); \
    remote=\$(echo \$selected | awk -F / '{print \$1}'); \
    target=\$(echo \$selected | awk '{print \$1}' | awk -F / '{print \$2}'); \
    [ -n \"\$remote\" ] && git push \$remote \$current_branch:\$target \
  " --block --confirm
'''
desc = "Git push (fzf remote/branch)"

[[manager.prepend_keymap]]
on   = [ "g", "d" ]
run  = 'shell "git-forgit diff" --block'
desc = "Git diff (forgit)"

[[manager.prepend_keymap]]
on   = [ "g", "u" ]
run  = '''
  shell " \
    current_branch=\$(git branch --show-current); \
    selected=\$(git branch -rv | fzf --header=\"\$current_branch (current branch)\n\$(git remote -v | awk '{print \$1 \" \" \$2}' | sort | uniq)\" \
      --preview=\"echo {} | awk '{print \\\$2}' | xargs git show\"); \
    remote=\$(echo \$selected | awk '{print \$1}' | awk -F / '{print \$1}'); \
    branch=\$(echo \$selected | awk '{print \$1}' | awk -F / '{print \$2}'); \
    [ -n \"\$remote\" ] && git pull \$remote \$branch \
  " --block --confirm
'''
desc = "Git pull (fzf remote/branch)"

